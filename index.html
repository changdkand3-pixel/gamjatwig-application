<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감자튀김 짬뽕전형 원서</title><style>
body{margin:0;background:#f5f5f5;color:#222;font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.5}.wrap{max-width:850px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #0001}.hero{padding:0;overflow:hidden}.hero img{width:100%;max-height:400px;object-fit:contain;background:#eee}.head{background:#e31837;color:white;padding:20px}h1{margin:0;font-size:30px}h2{margin-top:0}label,.legend{font-weight:700;display:block;margin:10px 0 6px}input[type=text],input[type=date],input[type=time],input[type=email],input[type=password],textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;box-sizing:border-box;font:inherit}.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{border:1px solid #ddd;border-radius:30px;padding:8px 11px;font-weight:400;display:flex;align-items:center;gap:5px;margin:0}.opt:has(input:checked){border-color:#e31837;background:#fff0f2}input{accent-color:#e31837}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}button{border:0;border-radius:9px;padding:11px 14px;margin:5px 5px 0 0;font:inherit;font-weight:700;background:#eee;cursor:pointer}.primary{background:#e31837;color:white}.status{white-space:pre-wrap;margin-top:10px}.note{color:#666;font-size:13px}.hidden{display:none}.entry{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}.hero{padding:0}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap">
<section class="card hero"><img src="./fries-holder.png" alt="빨간 감자튀김 홀더와 버거 브랜드 로고"><div class="head"><h1>감자튀김 짬뽕전형 원서</h1>좋아하는 버거 브랜드와 함께하는 취향 모임 지원서</div></section>
<section class="card"><h2>지원 정보 입력</h2><form id="form"><div class="grid">
<div><label for="nick">이름(닉네임) *</label><input id="nick" required maxlength="100" placeholder="이름 또는 닉네임"></div>
<div><span class="legend">성별</span><div class="opts"><label class="opt"><input type="radio" name="gender" value="남성">남성</label><label class="opt"><input type="radio" name="gender" value="여성">여성</label><label class="opt"><input type="radio" name="gender" value="응답 안 함" checked>응답 안 함</label></div></div>
<div class="full"><span class="legend">지원 브랜드 (복수 선택 가능) *</span><div class="opts" id="brands">
<label class="opt"><input type="checkbox" value="맥도날드">맥도날드</label><label class="opt"><input type="checkbox" value="롯데리아">롯데리아</label><label class="opt"><input type="checkbox" value="버거킹">버거킹</label><label class="opt"><input type="checkbox" value="KFC">KFC</label><label class="opt"><input type="checkbox" value="뉴욕버거">뉴욕버거</label><label class="opt"><input type="checkbox" value="쉐이크쉑">쉐이크쉑(쉑쉑버거)</label><label class="opt"><input type="checkbox" value="프랑크버거">프랑크버거</label><label class="opt"><input type="checkbox" value="파파이스">파파이스</label><label class="opt"><input type="checkbox" value="파이브가이즈">파이브가이즈</label><label class="opt"><input type="checkbox" value="맘스터치">맘스터치</label></div></div>
<div><label for="date">출석 희망 날짜</label><input id="date" type="date"></div><div><label for="time">희망 시간</label><input id="time" type="time"></div>
<div class="full"><span class="legend">참가 방식</span><div class="opts"><label class="opt"><input type="checkbox" name="att" value="오프라인 참가">오프라인 참가</label><label class="opt"><input type="checkbox" name="att" value="온라인 참가">온라인 참가</label></div></div>
<div class="full"><span class="legend">온라인 플랫폼 (선택사항)</span><div class="opts"><label class="opt"><input type="checkbox" name="plat" value="Zoom">Zoom</label><label class="opt"><input type="checkbox" name="plat" value="YouTube Live">YouTube Live</label></div></div>
<div class="full"><label for="memo">하고 싶은 말 / 관심 메뉴</label><textarea id="memo" maxlength="3000"></textarea></div></div>
<button class="primary" type="submit">지원서 제출</button><button type="reset">초기화</button><p class="note">제출 내용은 운영자 데이터베이스에 저장됩니다. 제출 후 수정·삭제는 운영자에게 요청해 주세요.</p><div id="status" class="status"></div></form></section>
<section class="card"><h2>관리자 명단 관리</h2><p class="note">Supabase 설정 후 관리자 계정으로 로그인하면 접수 명단을 조회하고 CSV로 내보낼 수 있습니다.</p>
<div id="login"><label>관리자 이메일</label><input id="email" type="email"><label>비밀번호</label><input id="password" type="password"><button class="primary" id="loginBtn" type="button">관리자 로그인</button><div id="loginStatus" class="status"></div></div>
<div id="admin" class="hidden"><button id="refresh" type="button">명단 새로고침</button><button id="csv" type="button">CSV 내보내기</button><button id="logout" type="button">로그아웃</button><div id="list"></div><div id="adminStatus" class="status"></div></div></section><p class="note" style="text-align:center">GitHub Pages 정적 웹사이트 · Supabase 데이터 저장</p></main>
<script>
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL",SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY",TABLE="applications";
const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("YOUR_")&&!SUPABASE_ANON_KEY.includes("YOUR_");
const db=ready?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null,$=x=>document.getElementById(x);
const checks=s=>[...document.querySelectorAll(s+":checked")].map(x=>x.value);
function status(id,t){$(id).textContent=t}
if(!ready){status("status","온라인 접수를 활성화하려면 README.md 안내에 따라 Supabase를 설정하세요.");status("loginStatus","Supabase 설정이 아직 필요합니다.")}
$("form").onsubmit=async e=>{e.preventDefault();if(!ready)return status("status","Supabase URL과 공개 anon key 설정이 필요합니다.");let brands=checks("#brands input");if(!brands.length)return status("status","지원 브랜드를 하나 이상 선택하세요.");let row={nickname:$("nick").value.trim(),gender:document.querySelector('[name=gender]:checked').value,brands,preferred_date:$("date").value||null,preferred_time:$("time").value||null,attendance:checks('[name=att]'),platform:checks('[name=plat]'),memo:$("memo").value.trim()};let {error}=await db.from(TABLE).insert(row);status("status",error?"접수 실패: "+error.message:"지원서가 접수되었습니다. 감사합니다!");if(!error)$("form").reset()};
$("loginBtn").onclick=async()=>{if(!ready)return status("loginStatus","Supabase 설정이 필요합니다.");let {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)return status("loginStatus","로그인 실패: 이메일/비밀번호 및 Auth 설정을 확인하세요.");$("login").classList.add("hidden");$("admin").classList.remove("hidden");load()};
$("logout").onclick=async()=>{await db.auth.signOut();$("admin").classList.add("hidden");$("login").classList.remove("hidden")};
$("refresh").onclick=load;
let rows=[];
async function load(){let {data,error}=await db.from(TABLE).select("*").order("created_at",{ascending:false}).limit(500);if(error)return status("adminStatus","조회 실패: "+error.message);rows=data||[];$("list").innerHTML="";status("adminStatus","지원자 "+rows.length+"명");rows.forEach(r=>{let d=document.createElement("div");d.className="entry";let p=document.createElement("p");p.textContent=`${r.nickname} | ${r.gender} | ${(r.brands||[]).join(", ")}`;d.appendChild(p);let q=document.createElement("p");q.textContent=`희망 일정: ${r.preferred_date||"미정"} ${r.preferred_time||""} / ${(r.attendance||[]).join(", ")} / ${(r.platform||[]).join(", ")}`;d.appendChild(q);let m=document.createElement("p");m.textContent="메모: "+(r.memo||"없음");d.appendChild(m);let b=document.createElement("button");b.textContent="삭제";b.onclick=async()=>{if(confirm("이 지원서를 삭제할까요?")){let {error}=await db.from(TABLE).delete().eq("id",r.id);if(error)status("adminStatus","삭제 실패: "+error.message);else load()}};d.appendChild(b);$("list").appendChild(d)})}
$("csv").onclick=()=>{let cols=["nickname","gender","brands","preferred_date","preferred_time","attendance","platform","memo","created_at"],esc=v=>'"'+String(Array.isArray(v)?v.join(", "):(v??"")).replace(/"/g,'""')+'"',csv=[cols.join(","),...rows.map(r=>cols.map(c=>esc(r[c])).join(","))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="감자튀김_짬뽕전형_지원자명단.csv";a.click()};
</script></body></html>
